<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>System Analysis Basic — Coming Soon</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #ffffff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: #222222;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100dvh;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .content {
      width: min(82vw, 1220px);
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateY(-2.5vh);
    }

    .logo {
      display: block;
      width: 100%;
      height: auto;
      max-height: 54vh;
      object-fit: contain;
      object-position: center;
    }

    .message {
      margin-top: clamp(18px, 2.3vh, 30px);
      text-align: center;
      line-height: 1.45;
      letter-spacing: 0.01em;
    }

    .message-ru {
      margin: 0;
      font-size: clamp(18px, 1.35vw, 24px);
      font-weight: 500;
    }

    .message-en {
      margin: 8px 0 0;
      font-size: clamp(14px, 1vw, 18px);
      font-weight: 400;
      color: #777777;
    }

    @media (max-width: 700px) {
      .content {
        width: 94vw;
        transform: translateY(-2vh);
      }

      .logo {
        max-height: 43vh;
      }

      .message {
        margin-top: 16px;
        padding: 0 18px;
      }

      .message-ru {
        font-size: 17px;
      }

      .message-en {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="content" aria-label="Страница готовится к запуску">
      <img
        class="logo"
        src="logo-blueprint.png"
        alt="System Analysis Basic"
        width="1817"
        height="866"
      >

      <div class="message">
        <p class="message-ru">Страница готовится к запуску. Скоро здесь появится больше.</p>
        <p class="message-en">The page is getting ready to launch. More is coming soon.</p>
      </div>
    </section>
  </main>
</body>
</html>
